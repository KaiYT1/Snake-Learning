name: Verify Installation Compat

on: [push, pull_request]

jobs:
    verify-build:
        strategy:
            matrix:
                os: [windows-latest, ubuntu-latest, macos-latest]
                python-version: ["3.10", "3.11", "3.12"]
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.python-version }}

            - name: Install System Dependencies (Linux Only)
              if: runner.os == 'Linux'
              run: |
                sudo apt-get update
                sudo apt-get install -y python3-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libsdl2-dev

            - name: Test Dependency Tree Build
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r requirements.txt

            - name: Verify Core Imports
              run: |
                pyton -c "import pygame, torch, numpy, matplotlib; print("Core stack verified successfully")"
